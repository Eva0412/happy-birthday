<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>С днём рождения! ✨ Уровень 12</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Rubik:wght@700;900&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root{ --pink:#ff7eb6; --pink2:#ffc2dd; --pink3:#ff4f9a; --lav:#c9a7ff; --deep:#5b2a6e; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',sans-serif;color:var(--deep);user-select:none;cursor:pointer;
    background:linear-gradient(180deg,#ffd6ec 0%,#f6c8ff 45%,#ffe4f1 100%)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:80}

  /* фон: солнце-кольцо и облака */
  .sun{position:fixed;left:50%;top:38%;width:min(90vw,520px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,#fff7fb 0%,#ffe0f0 40%,rgba(255,200,230,0) 70%);animation:breathe 5s ease-in-out infinite}
  .ring{position:fixed;left:50%;top:38%;width:min(80vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    border:2px dashed rgba(255,255,255,.8);animation:spin 40s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.06)}}
  .cloud{position:fixed;background:#fff;border-radius:50px;opacity:.85;filter:blur(.3px)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:160%;left:14%;bottom:20%}
  .cloud::after{width:40%;height:130%;right:12%;bottom:25%}
  .c1{width:130px;height:34px;top:12%;left:-140px;animation:drift 38s linear infinite}
  .c2{width:90px;height:24px;top:26%;left:-100px;animation:drift 52s linear infinite 10s}
  .c3{width:160px;height:40px;top:60%;left:-170px;animation:drift 46s linear infinite 22s;opacity:.6}
  @keyframes drift{to{transform:translateX(calc(100vw + 340px))}}

  /* HUD уровня */
  .hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;width:min(92vw,460px);
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);
    padding:8px 14px;border-radius:40px;box-shadow:0 6px 20px rgba(200,80,150,.25);border:2px solid #fff;
    opacity:0;transition:opacity .6s}
  .hud.show{opacity:1}
  .lv{font-family:'Rubik';font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--pink3),#b76bff);
    padding:5px 11px;border-radius:20px;white-space:nowrap;transition:transform .3s}
  .lv.pop{animation:lvpop .7s ease}
  @keyframes lvpop{40%{transform:scale(1.5) rotate(-6deg)}}
  .bar{flex:1;height:14px;background:#ffe3f0;border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
  .bar i{display:block;height:100%;width:0;border-radius:10px;transition:width .8s cubic-bezier(.3,1.4,.5,1);
    background:linear-gradient(90deg,#ff9ccc,var(--pink3),#b76bff);background-size:200% 100%;animation:flow 2s linear infinite}
  @keyframes flow{to{background-position:-200% 0}}
  .xp{font-weight:900;font-size:12px;color:var(--pink3);white-space:nowrap}

  /* Героиня */
  .hero-wrap{position:fixed;left:50%;bottom:min(30vh,230px);transform:translateX(-50%);z-index:10;
    height:min(56vh,480px);aspect-ratio:300/420}
  .platform{position:absolute;left:10%;right:10%;bottom:-4%;height:9%;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,79,154,.45),rgba(255,79,154,0) 70%);animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{opacity:.5;transform:scaleX(.9)}}
  .hero{width:100%;height:100%;opacity:0;transform:translateY(40px) scale(.8);transition:all .9s cubic-bezier(.3,1.6,.5,1)}
  .hero.show{opacity:1;transform:none}
  .hero svg{width:100%;height:100%;overflow:visible;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .wave{transform-box:view-box;transform-origin:192px 252px;animation:wave 1.1s ease-in-out infinite}
  @keyframes wave{50%{transform:rotate(-14deg)}}
  .cat{position:absolute;bottom:-3%;width:36%;opacity:0;transform:translateY(30px) scale(.6);
    transition:all .8s cubic-bezier(.3,1.7,.5,1)}
  .cat-l{left:max(-14%, calc(50% - 50vw + 2px))} .cat-r{right:max(-14%, calc(50% - 50vw + 2px))}
  .cat.show{opacity:1;transform:none}
  .cat.jump{animation:catjump .6s ease}
  @keyframes catjump{40%{transform:translateY(-28%)}}
  .cat svg{width:100%;overflow:visible}
  .ctail{transform-box:view-box;transform-origin:80px 146px;animation:tail 1.8s ease-in-out infinite}
  .cat-r .ctail{transform-origin:40px 146px;animation-direction:reverse}
  @keyframes tail{50%{transform:rotate(-12deg)}}
  .ceye{transform-box:fill-box;transform-origin:center;animation:blink 5.3s infinite 1.3s}
  .cat-r .ceye{animation-delay:2.7s}
  .jp{font-weight:900;font-size:clamp(18px,5vw,26px);color:var(--deep);background:rgba(255,255,255,.8);padding:6px 18px;border-radius:30px}
  .jp b{color:var(--pink3)}
  .jp-small{font-weight:800;font-size:clamp(12px,3.4vw,15px);letter-spacing:.08em;color:var(--deep);
    display:inline-block;background:rgba(255,255,255,.6);padding:4px 14px;border-radius:20px}
  .happy .mouth-open{display:block}.mouth-open{display:none}
  .happy .mouth-closed{display:none}

  /* Торт */
  .cake{position:fixed;left:50%;bottom:min(28vh,215px);z-index:15;width:min(44vw,210px);
    transform:translateX(-50%) scale(0);transition:transform .7s cubic-bezier(.3,1.7,.5,1)}
  .cake.show{transform:translateX(-50%) scale(1)}
  .cake svg{width:100%;overflow:visible}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
  @keyframes flick{to{transform:scale(.85,1.12) rotate(4deg)}}
  .out .flame{animation:none;transform:scale(0);transition:transform .3s}
  .smoke{opacity:0}
  .out .smoke{animation:smoke 1.6s ease-out forwards}
  @keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
  .tap-cake{position:absolute;left:-50%;right:-50%;margin:auto;width:max-content;top:-34px;white-space:nowrap;font-weight:900;font-size:14px;
    color:#fff;background:var(--pink3);padding:5px 12px;border-radius:20px;animation:pulse 1.1s infinite}
  .out .tap-cake{display:none}

  /* Диалог */
  .dialog{position:fixed;left:50%;bottom:16px;transform:translate(-50%,30px);z-index:30;width:min(94vw,600px);
    min-height:min(24vh,170px);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:22px;
    border:3px solid #fff;box-shadow:0 0 0 3px var(--pink),0 14px 40px rgba(180,60,140,.35);
    padding:26px 22px 20px;opacity:0;transition:all .5s cubic-bezier(.3,1.5,.5,1)}
  .dialog.show{opacity:1;transform:translate(-50%,0)}
  .tag{position:absolute;top:-17px;left:20px;font-family:'Rubik';font-weight:700;font-size:14px;color:#fff;
    background:linear-gradient(135deg,var(--pink3),#b76bff);padding:6px 16px;border-radius:14px;box-shadow:0 4px 10px rgba(180,60,140,.35)}
  .say{font-weight:800;font-size:clamp(16px,4.3vw,21px);line-height:1.45;min-height:3em}
  .next{position:absolute;right:18px;bottom:10px;color:var(--pink3);font-size:18px;animation:hop .7s ease-in-out infinite;opacity:0}
  .next.on{opacity:1}
  @keyframes hop{50%{transform:translateY(4px)}}

  /* Стартовый экран */
  .start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    text-align:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),rgba(255,214,236,.2));transition:opacity .6s}
  .start.hide{opacity:0;pointer-events:none}
  .quest{font-family:'Rubik';font-weight:700;letter-spacing:.35em;font-size:13px;color:#fff;background:var(--deep);padding:6px 14px;border-radius:20px}
  .big{font-family:'Rubik';font-weight:900;line-height:1.05;font-size:clamp(38px,11vw,76px);color:#fff;
    text-shadow:0 4px 0 var(--pink3),0 8px 0 #b76bff,0 14px 30px rgba(150,40,120,.4);animation:float 2.6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
  .press{font-weight:900;font-size:clamp(15px,4vw,19px);color:#fff;background:linear-gradient(135deg,var(--pink3),#b76bff);
    padding:14px 30px;border-radius:40px;box-shadow:0 8px 0 #9b3c9f,0 14px 30px rgba(150,40,120,.35);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}

  /* Финал */
  .final{position:fixed;left:50%;top:50%;z-index:45;transform:translate(-50%,-50%) scale(0);text-align:center;
    transition:transform .8s cubic-bezier(.3,1.7,.5,1);pointer-events:none;width:92vw}
  .final.show{transform:translate(-50%,-50%) scale(1)}
  .levelup{font-family:'Rubik';font-weight:900;font-size:clamp(46px,14vw,96px);color:#fff;line-height:1;
    text-shadow:0 4px 0 var(--pink3),0 8px 0 #b76bff,0 16px 40px rgba(150,40,120,.5)}
  .levelup small{display:block;font-size:.36em;letter-spacing:.2em;margin-bottom:6px}
  .final .from{margin-top:16px;display:inline-block;font-weight:900;font-size:clamp(16px,4.5vw,22px);color:var(--deep);
    background:rgba(255,255,255,.85);padding:10px 22px;border-radius:30px;box-shadow:0 8px 24px rgba(180,60,140,.3)}
  .again{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:46;font-family:'Nunito';font-weight:900;font-size:15px;
    color:var(--pink3);background:#fff;border:none;padding:11px 24px;border-radius:30px;box-shadow:0 6px 18px rgba(180,60,140,.3);
    cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s 1.2s}
  .again.show{opacity:1;pointer-events:auto}
  /* Барабан */
  .wheel-screen{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:16px;background:rgba(255,222,240,.88);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .5s}
  .wheel-screen.show{opacity:1;pointer-events:auto}
  .w-title{font-family:'Rubik';font-weight:900;font-size:clamp(28px,8vw,46px);color:#fff;text-align:center;line-height:1.05;
    text-shadow:0 3px 0 var(--pink3),0 6px 0 #b76bff,0 10px 24px rgba(150,40,120,.35)}
  .w-info{font-weight:900;font-size:15px;color:var(--deep);background:#fff;padding:6px 16px;border-radius:20px;box-shadow:0 4px 12px rgba(180,60,140,.2)}
  .w-box{position:relative;width:min(88vw,430px,56vh);aspect-ratio:1;margin-top:8px}
  #wheel{width:100%;height:100%;transition:transform 5.5s cubic-bezier(.12,.62,.08,1);filter:drop-shadow(0 12px 24px rgba(150,40,120,.35))}
  .w-pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:3;width:0;height:0;
    border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--deep);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
  .w-pointer::after{content:"";position:absolute;left:-9px;top:-30px;width:18px;height:18px;border-radius:50%;background:#fff36b}
  .w-hub{position:absolute;inset:0;margin:auto;width:27%;height:27%;border-radius:50%;border:5px solid #fff;z-index:2;
    background:linear-gradient(135deg,var(--pink3),#b76bff);color:#fff;font-family:'Rubik';font-weight:900;font-size:clamp(11px,3.2vw,16px);
    cursor:pointer;box-shadow:0 6px 18px rgba(150,40,120,.45);animation:hubglow 1.4s ease-in-out infinite}
  @keyframes hubglow{50%{box-shadow:0 6px 18px rgba(150,40,120,.45),0 0 0 8px rgba(255,79,154,.3)}}
  .w-hub:disabled{animation:none;opacity:.85;cursor:default}
  .w-hint{font-weight:800;font-size:14px;color:var(--deep);opacity:.8;text-align:center}
  .bulb{animation:bulb .8s steps(1) infinite}
  .bulb.b2{animation-delay:.4s}
  @keyframes bulb{50%{fill:#fff}}

  .prize{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(90,40,110,.45);opacity:0;pointer-events:none;transition:opacity .4s}
  .prize.show{opacity:1;pointer-events:auto}
  .prize-card{background:#fff;border-radius:28px;padding:26px 22px 22px;width:min(92vw,400px);text-align:center;
    box-shadow:0 0 0 4px var(--pink),0 20px 60px rgba(90,20,90,.45);transform:scale(.6);transition:transform .5s cubic-bezier(.3,1.7,.5,1)}
  .prize.show .prize-card{transform:scale(1)}
  .p-label{font-family:'Rubik';font-weight:900;letter-spacing:.2em;font-size:13px;color:var(--pink3)}
  .p-icon{font-size:72px;line-height:1.2;margin:6px 0;animation:float 2.4s ease-in-out infinite}
  .p-text{font-weight:900;font-size:clamp(20px,5.5vw,26px);color:var(--deep);line-height:1.25}
  .p-note{font-weight:700;font-size:14px;color:#8a5a96;margin-top:10px;line-height:1.4}
  .p-btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .p-btns button{font-family:'Nunito';font-weight:900;font-size:17px;border:none;border-radius:30px;padding:13px 18px;cursor:pointer}
  .b-take{color:#fff;background:linear-gradient(135deg,var(--pink3),#b76bff);box-shadow:0 6px 0 #9b3c9f}
  .b-take:active{transform:translateY(3px);box-shadow:0 3px 0 #9b3c9f}
  .b-re{color:var(--deep);background:#f3e6ff}

  .dim .hero-wrap,.dim .cake{filter:blur(2px) brightness(1.05);transition:filter .8s}
</style>
</head>
<body>
<div class="sun"></div><div class="ring"></div>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<canvas id="fx"></canvas>

<div class="hud" id="hud"><span class="lv" id="lv">LV. 11</span><span class="bar"><i id="xp"></i></span><span class="xp" id="xpt">0%</span></div>

<!-- Героиня (оригинальный персонаж) -->
<div class="hero-wrap">
  <div class="platform"></div>
  <div class="hero" id="hero">
  <svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4e3b2e"/><stop offset=".6" stop-color="#6e5441"/><stop offset="1" stop-color="#a07e5e"/>
      </linearGradient>
      <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2b150a"/><stop offset=".55" stop-color="#6b3b1f"/><stop offset="1" stop-color="#d0945c"/>
      </linearGradient>
      <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff9ccc"/><stop offset="1" stop-color="#ff6fae"/>
      </linearGradient>
    </defs>

    <!-- волосы сзади: отросший шэгги -->
    <path class="shag" fill="url(#hair)" d="M64,150 C54,78 102,44 150,44 C198,44 246,78 236,150 C240,180 238,206 250,234 L230,224 L236,256 L214,236 L212,264 L196,236 L104,236 L88,264 L86,236 L64,256 L70,224 L50,234 C62,206 60,180 64,150 Z"/>
    <g stroke="#e3c79f" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M72,170 C70,200 66,220 60,240"/><path d="M228,170 C230,200 234,220 240,240"/>
      <path d="M84,190 C82,215 84,235 88,256"/><path d="M216,190 C218,215 216,235 212,256"/>
    </g>

    <!-- ноги -->
    <rect x="126" y="352" width="16" height="40" rx="7" fill="#ffe3d3"/>
    <rect x="158" y="352" width="16" height="40" rx="7" fill="#ffe3d3"/>
    <rect x="126" y="372" width="16" height="20" fill="#fff"/><rect x="158" y="372" width="16" height="20" fill="#fff"/>
    <ellipse cx="132" cy="396" rx="15" ry="9" fill="#7a3d6b"/><ellipse cx="168" cy="396" rx="15" ry="9" fill="#7a3d6b"/>
    <!-- левая рука -->
    <path d="M110,252 Q92,290 100,326" stroke="url(#hood)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="101" cy="330" r="11" fill="#ffe3d3"/>
    <!-- худи-платье -->
    <path fill="url(#hood)" d="M104,300 C102,250 120,224 150,224 C180,224 198,250 196,300 L210,362 C180,372 120,372 90,362 Z"/>
    <path fill="#fff" opacity=".9" d="M128,226 L150,256 L172,226 C165,222 135,222 128,226 Z"/>
    <path fill="#fff" d="M150,312 C150,312 132,300 132,289 C132,281 142,278 150,286 C158,278 168,281 168,289 C168,300 150,312 150,312 Z"/>
    <path d="M96,345 Q150,358 204,345" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>
    <!-- шея и лицо -->
    <rect x="140" y="206" width="20" height="22" fill="#f7cdb9"/>
    <path fill="#ffe3d3" d="M78,140 C78,95 110,80 150,80 C190,80 222,95 222,140 C222,186 190,218 150,221 C110,218 78,186 78,140 Z"/>
    <!-- глаза -->
    <g class="eye">
      <ellipse cx="117" cy="157" rx="17" ry="21" fill="#fff"/>
      <ellipse cx="117" cy="159" rx="14" ry="18" fill="url(#iris)"/>
      <ellipse cx="117" cy="161" rx="6.5" ry="9" fill="#2a1238"/>
      <circle cx="111" cy="150" r="5.5" fill="#fff"/><circle cx="123" cy="167" r="2.6" fill="#fff"/>
      <path d="M98,146 Q116,128 137,143" stroke="#2a1238" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M98,146 L92,141" stroke="#2a1238" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="eye">
      <ellipse cx="183" cy="157" rx="17" ry="21" fill="#fff"/>
      <ellipse cx="183" cy="159" rx="14" ry="18" fill="url(#iris)"/>
      <ellipse cx="183" cy="161" rx="6.5" ry="9" fill="#2a1238"/>
      <circle cx="177" cy="150" r="5.5" fill="#fff"/><circle cx="189" cy="167" r="2.6" fill="#fff"/>
      <path d="M163,143 Q184,128 202,146" stroke="#2a1238" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M202,146 L208,141" stroke="#2a1238" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- румянец -->
    <ellipse cx="100" cy="186" rx="13" ry="6" fill="#ff8fbf" opacity=".55"/>
    <ellipse cx="200" cy="186" rx="13" ry="6" fill="#ff8fbf" opacity=".55"/>
    <path d="M94,183 l4,-5 M101,184 l4,-5 M194,183 l4,-5 M201,184 l4,-5" stroke="#ff6fae" stroke-width="1.6" stroke-linecap="round"/>
    <!-- рот -->
    <path class="mouth-closed" d="M143,191 Q150,197 157,191" stroke="#c94a6e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <g class="mouth-open"><path d="M140,189 Q150,205 160,189 Z" fill="#d9536f"/><path d="M144,197 Q150,201 156,197 Q150,195 144,197Z" fill="#ff9db5"/></g>
    <!-- чёлка -->
    <path fill="url(#hair)" d="M76,146 C72,92 108,66 150,66 C192,66 228,92 224,146 C216,124 206,110 194,100 C192,118 186,128 178,134 C178,116 172,104 164,96 C160,118 150,128 136,134 C140,116 138,104 132,96 C122,112 112,124 98,130 C104,116 104,108 104,100 C92,112 82,128 76,146 Z"/>
    <!-- боковые рваные пряди шэгги -->
    <path fill="url(#hair)" d="M80,112 C70,160 74,200 62,230 L78,214 L80,242 C92,208 92,170 98,136 Z"/>
    <path fill="url(#hair)" d="M220,112 C230,160 226,200 238,230 L222,214 L220,242 C208,208 208,170 202,136 Z"/>
    <!-- осветлённые прядки -->
    <g stroke="#ecd3ab" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".85">
      <path d="M118,74 C112,92 108,108 102,124"/><path d="M168,74 C172,92 172,110 176,128"/>
      <path d="M146,68 C142,90 140,110 136,128"/><path d="M86,140 C82,170 80,195 72,222"/><path d="M214,140 C218,170 220,195 228,222"/>
    </g>
    <!-- наушники с ушками -->
    <path d="M72,150 C64,58 236,58 228,150" stroke="#ff7eb6" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path fill="#ff7eb6" d="M97,94 L92,46 L131,80 Z"/><path fill="#ffc2dd" d="M102,88 L99,58 L122,79 Z"/>
    <path fill="#ff7eb6" d="M203,94 L208,46 L169,80 Z"/><path fill="#ffc2dd" d="M198,88 L201,58 L178,79 Z"/>

<script>
/* ===== НАСТРОЙКИ — меняйте здесь ===== */
const CONFIG = {
  name: "Ева",                      // имя именинницы
  from: "",                         // от кого (пусто — без подписи)
  lines: [
    "Ура-а-а! Сегодня особенный день! ✨",

  ],
  // Призы на барабане: icon — значок, short — коротко на барабане (до 10 букв), full — полный текст приза
  prizes: [
    { icon:"💗", short:"Плед",          full:"Мягкий розовый плед — он уже едет к тебе!" },
    { icon:"🍦", short:"Мороженки",     full:"3 мороженки — любые, какие захочешь!" },
    { icon:"🍕", short:"Пицца",         full:"Пицца на ужин — выбираешь ты!" },
    { icon:"🥤", short:"Липтон/Мохито", full:"Липтон или Мохито — на выбор!" },
    { icon:"🧹", short:"Без уборки",    full:"Целый день без уборки и домашних дел" },
    { icon:"🎬", short:"Кино дома",     full:"Смотрим вместе фильм — выбираешь ты!" },
    { icon:"💎", short:"Донат 300₽",    full:"Донат 300 ₽ в твою любимую игру!" },
    { icon:"🛌", short:"Ночёвка",       full:"Пижамная вечеринка: подруга остаётся с ночёвкой!" }
  ],
  rerolls: 2   // сколько раз можно перекрутить
};
/* ===================================== */

const $ = id => document.getElementById(id);
const lines = CONFIG.lines.map(s => s.replace('{name}', CONFIG.name));
$('tag').textContent = '💌 Для ' + (CONFIG.name === 'Ева' ? 'Евы' : CONFIG.name);
$('fromLine').textContent = CONFIG.from ? 'С любовью, ' + CONFIG.from + ' 💕' : 'Мы тебя очень любим! 💕';

/* ---------- частицы: сакура, искры, сердечки ---------- */
const cv = $('fx'), ctx = cv.getContext('2d'); let W, H, D = devicePixelRatio || 1;
function rs(){ W = cv.width = innerWidth*D; H = cv.height = innerHeight*D; } addEventListener('resize', rs); rs();
const R = (a,b) => a + Math.random()*(b-a);
const petals = Array.from({length:32}, () => newPetal(true));
function newPetal(any){ return {x:R(0,W), y:any?R(0,H):R(-60,-10), s:R(6,12)*D, vy:R(.6,1.5)*D, vx:R(-.4,.6)*D, r:R(0,6.28), vr:R(-.03,.03), f:R(0,6.28)}; }
const twinkles = Array.from({length:26}, () => ({x:Math.random(), y:Math.random()*.7, p:R(0,6.28), s:R(.03,.07), r:R(4,9)}));
let bursts = [];
const COLORS = ['#ff4f9a','#ff9ccc','#b76bff','#fff36b','#7fd6ff','#ffffff'];
function burst(x, y, n=60, kind='mix'){
  for(let i=0;i<n;i++){ const a=R(0,6.28), v=R(2,11)*D;
    bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-R(1,5)*D,s:R(7,15)*D,c:COLORS[i%COLORS.length],
      k: kind==='heart' ? 'h' : ['h','s','c'][i%3], life:1, d:R(.007,.014), r:R(0,6.28), vr:R(-.2,.2)}); }
}
/* фейерверк и цветное конфетти */
const FW = ['#ff3d7f','#ffd23f','#3ee8b5','#4da3ff','#b76bff','#ff8a3d','#ff7eb6','#7dff6b'];
let rockets = [];
function fireworks(n=6){
  for(let i=0;i<n;i++) setTimeout(() => rockets.push({x:R(W*.12,W*.88), y:H+10, ty:R(H*.1,H*.42), vy:-R(11,15)*D, c:FW[Math.floor(R(0,FW.length))]}), i*280);
}
function explode(x, y, c){
  const n = 70, c2 = FW[Math.floor(R(0,FW.length))];
  for(let k=0;k<n;k++){ const a = k/n*6.283 + R(-.05,.05), v = R(3.5,7.5)*D;
    bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:R(5,8)*D,c:k%3?c:c2,k:'fw',life:1,d:R(.012,.02),r:0,vr:0}); }
}
function confetti(n=160){
  for(let i=0;i<n;i++) bursts.push({x:R(0,W), y:R(-H*.5,-10), vx:R(-1.5,1.5)*D, vy:R(1,4)*D, s:R(8,14)*D,
    c:FW[i%FW.length], k:'conf', life:1, d:R(.003,.006), r:R(0,6.28), vr:R(-.2,.2)});
}
function heart(s){ ctx.beginPath(); ctx.moveTo(0,s*.3); ctx.bezierCurveTo(-s,-s*.4,-s*.4,-s*1.1,0,-s*.45);
  ctx.bezierCurveTo(s*.4,-s*1.1,s,-s*.4,0,s*.3); ctx.fill(); }
function star(s){ ctx.beginPath(); for(let i=0;i<10;i++){ const r=i%2?s*.42:s, a=i*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);} ctx.fill(); }
function sparkle(x,y,r,o){ ctx.globalAlpha=o; ctx.fillStyle='#fff'; ctx.beginPath();
  ctx.moveTo(x,y-r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r); ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r); ctx.fill(); }
(function loop(){
  ctx.clearRect(0,0,W,H);
  for(const t of twinkles){ t.p+=t.s; sparkle(t.x*W, t.y*H, t.r*D*(.6+.4*Math.sin(t.p)), (Math.sin(t.p)+1)/2*.9); }
  for(const p of petals){
    p.f+=.03; p.x+=p.vx+Math.sin(p.f)*.8*D; p.y+=p.vy; p.r+=p.vr;
    if(p.y>H+20||p.x>W+30) Object.assign(p,newPetal(false));
    ctx.save(); ctx.globalAlpha=.85; ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.scale(1,Math.abs(Math.cos(p.f))*.6+.4);
    ctx.fillStyle='#ffb7d5'; ctx.beginPath(); ctx.moveTo(0,-p.s); ctx.quadraticCurveTo(p.s*.8,-p.s*.2,0,p.s); ctx.quadraticCurveTo(-p.s*.8,-p.s*.2,0,-p.s); ctx.fill();
    ctx.fillStyle='#ff8fbf'; ctx.fillRect(-.5*D,-p.s*.6,1*D,p.s*.8); ctx.restore();
  }
  rockets = rockets.filter(rk => {
    rk.y += rk.vy; rk.vy *= .987;
    ctx.globalAlpha = 1; ctx.fillStyle = rk.c; ctx.beginPath(); ctx.arc(rk.x, rk.y, 3*D, 0, 6.28); ctx.fill();
    ctx.globalAlpha = .4; ctx.fillRect(rk.x-1*D, rk.y, 2*D, 26*D);
    if (rk.y <= rk.ty || rk.vy > -1.5*D) { explode(rk.x, rk.y, rk.c); return false; }
    return true;
  });
  bursts = bursts.filter(b=>b.life>0 && b.y < H+40);
  for(const b of bursts){
    if (b.k==='fw'){ b.vx*=.95; b.vy=b.vy*.95+.06*D; } else if (b.k==='conf'){ b.vx*=.99; b.vy=Math.min(b.vy+.05*D, 3.5*D); }
    else { b.vx*=.97; b.vy=b.vy*.97+.18*D; }
    b.x+=b.vx + (b.k==='conf' ? Math.sin(b.r)*.8*D : 0); b.y+=b.vy; b.r+=b.vr; b.life-=b.d;
    ctx.save(); ctx.globalAlpha=Math.max(0,b.life); ctx.fillStyle=b.c; ctx.translate(b.x,b.y); ctx.rotate(b.r);
    if(b.k==='fw'){ ctx.beginPath(); ctx.arc(0,0,b.s*.32,0,6.28); ctx.fill(); ctx.globalAlpha*=.35; ctx.beginPath(); ctx.arc(0,0,b.s*.7,0,6.28); ctx.fill(); }
    else if(b.k==='conf'){ ctx.scale(1, Math.cos(b.r*1.7)); ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); }
    else if(b.k==='h') heart(b.s); else if(b.k==='s') star(b.s*.7); else { ctx.beginPath(); ctx.arc(0,0,b.s*.35,0,6.28); ctx.fill(); }
    ctx.restore(); }
  ctx.globalAlpha=1; requestAnimationFrame(loop);
})();

/* ---------- сценарий ---------- */
let step = -1, typing = false, timer = null, stage = 'start';
function setXP(p){ $('xp').style.width = p + '%'; $('xpt').textContent = Math.round(p) + '%'; }
function type(text){
  const el = $('say'); el.textContent = ''; typing = true; $('next').classList.remove('on'); let i = 0;
  clearInterval(timer);
  timer = setInterval(() => { el.textContent = text.slice(0, ++i);
    if(i >= text.length){ clearInterval(timer); typing = false; $('next').classList.add('on'); } }, 34);
}
function nextLine(){
  if(typing){ clearInterval(timer); $('say').textContent = lines[step]; typing = false; $('next').classList.add('on'); return; }
  step++;
  if(step >= lines.length) return;
  setXP((step+1) / (lines.length+1) * 100);
  $('hero').classList.toggle('happy', step % 2 === 0 || step === lines.length-1);
  type(lines[step]);
  if(step === 1) burst(W/2, H*.35, 40, 'heart');
  if(lines[step].includes('🐾')) ['catL','catR'].forEach((id,i) => setTimeout(() => {
    const c = $(id); c.classList.remove('jump'); void c.offsetWidth; c.classList.add('jump'); }, i*250));
  if(step === lines.length-1){ stage = 'cake'; setTimeout(() => $('cake').classList.add('show'), 600); }
}
function blowCandles(){
  if(stage !== 'cake' || typing) return;
  stage = 'final';
  $('cake').classList.add('out');
  setXP(100); $('dialog').classList.remove('show');
  setTimeout(() => {
    const lv = $('lv'); lv.textContent = 'LV. 12'; lv.classList.add('pop');
    document.body.classList.add('dim');
    $('final').classList.add('show'); $('again').classList.add('show');
    burst(W*.2, H*.4, 90); burst(W*.8, H*.4, 90); burst(W/2, H*.25, 120, 'heart');
    let k = 0; const iv = setInterval(() => { burst(R(W*.1,W*.9), R(H*.15,H*.5), 50); if(++k > 6) clearInterval(iv); }, 450);
  }, 700);
}
document.addEventListener('click', e => {
  if(e.target.closest('#again')) return;
  if(stage === 'start'){
    stage = 'talk'; $('start').classList.add('hide');
    burst(W/2, H/2, 80);
    setTimeout(() => { $('hero').classList.add('show'); $('hud').classList.add('show'); }, 300);
    setTimeout(() => { $('catL').classList.add('show'); }, 800);
    setTimeout(() => { $('catR').classList.add('show'); }, 1000);
    setTimeout(() => { $('dialog').classList.add('show'); nextLine(); }, 1200);
    return;
  }
  if(stage === 'talk' || (stage === 'cake' && typing)) { nextLine(); return; }
  if(stage === 'cake'){ if(e.target.closest('#cake') || true) blowCandles(); return; }
  if(stage === 'final') burst(e.clientX*D, e.clientY*D, 30, 'heart');
});
$('again').addEventListener('click', openWheel);

/* ---------- барабан призов ---------- */
const KEY = 'eva-birthday-wheel-2026';
function checkReset(){
  if (location.hash !== '#reset') return false;
  try { localStorage.removeItem(KEY) } catch(e) {}
  history.replaceState(null, '', location.pathname); return true;
}
checkReset();
addEventListener('hashchange', () => { if (checkReset()) location.reload(); });
const P = CONFIG.prizes, N = P.length, SEG = 360 / N, MAX = 1 + CONFIG.rerolls;
const WCOL = ['#ff7eb6','#b76bff','#ff9ccc','#7fb8ff','#ff4f9a','#c9a7ff','#ffb3d6','#9b8cff'];
let st; try { st = JSON.parse(localStorage.getItem(KEY)) } catch(e) {}
st = st || { spins:0, rejected:[], pending:null, claimed:null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)) } catch(e) {} };
let rot = 0, spinning = false;

function arc(a1, a2, r){
  const p = a => [Math.sin(a*Math.PI/180)*r, -Math.cos(a*Math.PI/180)*r];
  const [x1,y1] = p(a1), [x2,y2] = p(a2);
  return `M0,0 L${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} Z`;
}
function drawWheel(){
  let s = '<circle r="106" fill="#fff"/><circle r="102" fill="#5b2a6e"/>';
  P.forEach((p,i) => {
    const off = st.rejected.includes(i), c = (i+.5)*SEG;
    s += `<path d="${arc(i*SEG, (i+1)*SEG, 98)}" fill="${off ? '#e4dbe8' : WCOL[i % WCOL.length]}" stroke="#fff" stroke-width="1.5"/>`;
    s += `<g transform="rotate(${c})" opacity="${off ? .45 : 1}">
      <text y="-87" text-anchor="middle" dominant-baseline="middle" font-size="13">${p.icon}</text>
      <text transform="translate(0,-58) rotate(-90)" text-anchor="middle" dominant-baseline="middle"
        font-family="Nunito" font-weight="900" font-size="${Math.min(9.5, 68 / [...p.short].length).toFixed(1)}" fill="#fff" ${off ? 'text-decoration="line-through"' : ''}
        style="paint-order:stroke" stroke="rgba(90,30,100,.35)" stroke-width="1.5">${p.short}</text></g>`;
  });
  for (let k=0;k<24;k++){ const a=k*15*Math.PI/180;
    s += `<circle class="bulb ${k%2?'b2':''}" cx="${Math.sin(a)*102}" cy="${-Math.cos(a)*102}" r="2.6" fill="#fff36b"/>`; }
  $('wheel').innerHTML = s;
}
function info(){
  const left = MAX - st.spins;
  $('wInfo').textContent = st.claimed !== null ? '🏆 Награда получена!'
    : st.spins === 0 ? '🎡 Крути барабан!' : `🔄 Перекрутов осталось: ${left}`;
  $('spinBtn').disabled = st.claimed !== null || st.pending !== null || left <= 0;
}
function openWheel(){
  stage = 'wheel'; drawWheel(); info();
  $('final').classList.remove('show'); $('again').classList.remove('show');
  $('wheelScreen').classList.add('show');
  if (st.claimed !== null) setTimeout(() => showClaimed(st.claimed), 500);
  else if (st.pending !== null) setTimeout(() => showResult(st.pending), 500);
}
function spin(){
  if (spinning || st.claimed !== null || st.pending !== null || st.spins >= MAX) return;
  const avail = P.map((_,i)=>i).filter(i => !st.rejected.includes(i));
  const i = avail[Math.floor(Math.random()*avail.length)];
  st.spins++; st.pending = i; save();
  spinning = true; $('spinBtn').disabled = true;
  const target = (360 - (i+.5)*SEG + R(-SEG*.3, SEG*.3) + 360) % 360;
  rot += 360*6 + ((target - rot % 360) + 360) % 360;
  $('wheel').style.transform = `rotate(${rot}deg)`;
  setTimeout(() => { fireworks(6); confetti(170); }, 5500);
  setTimeout(() => { spinning = false; showResult(i); }, 6300);
}
function showResult(i){
  const p = P[i], left = MAX - st.spins;
  $('pLabel').textContent = 'ВЫПАЛО:';
  $('pIcon').textContent = p.icon; $('pText').textContent = p.full;
  $('pNote').textContent = left > 0 ? 'Забираешь или попробуешь удачу ещё раз? Если перекрутишь, этот приз сгорит!' : 'Это была последняя попытка — приз твой! 🎉';
  $('pBtns').innerHTML = '<button class="b-take" id="bTake">✅ Забираю!</button>' +
    (left > 0 ? `<button class="b-re" id="bRe">🔄 Перекрутить (осталось ${left})</button>` : '');
  $('bTake').onclick = () => { st.claimed = i; st.pending = null; save(); showClaimed(i); };
  if (left > 0) $('bRe').onclick = () => { st.rejected.push(i); st.pending = null; save();
    $('prize').classList.remove('show'); drawWheel(); info(); };
  $('prize').classList.add('show');
  burst(W/2, H*.35, 50);
}
function showClaimed(i){
  const p = P[i];
  $('pLabel').textContent = '🏆 ТВОЯ НАГРАДА 🏆';
  $('pIcon').textContent = p.icon; $('pText').textContent = p.full;
  $('pNote').textContent = 'Сделай скриншот этого экрана и покажи родным — награда ждёт тебя! 💕';
  $('pBtns').innerHTML = '';
  $('prize').classList.add('show'); info();
  burst(W*.25, H*.4, 90); burst(W*.75, H*.4, 90); burst(W/2, H*.25, 100, 'heart');
}
$('spinBtn').addEventListener('click', spin);
</script>
